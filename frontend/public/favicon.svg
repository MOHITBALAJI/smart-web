<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#334155" stroke-width="12"/>

  <!-- Shield Base -->
  <path d="M 256 96 C 330 96, 384 116, 400 136 C 400 260, 360 360, 256 416 C 152 360, 112 260, 112 136 C 128 116, 182 96, 256 96 Z" 
        fill="url(#shieldGrad)" 
        stroke="#38bdf8" 
        stroke-width="12"/>

  <!-- Siren Light / Cross Signal -->
  <circle cx="256" cy="200" r="32" fill="#ef4444" stroke="#ffffff" stroke-width="8"/>

  <!-- Emergency Wave Lines -->
  <path d="M 160 280 Q 208 250, 256 280 T 352 280" fill="none" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 176 320 Q 216 295, 256 320 T 336 320" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
</svg>
